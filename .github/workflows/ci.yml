name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Новый коммит в той же ветке отменяет ещё не закончившийся прогон предыдущего
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linq:
    name: MyLinq и методичка (net8.0 + net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Проект тестов собирается под оба TFM, dotnet test прогоняет их по очереди
      - name: Тесты MyLinq
        run: dotnet test tests/CoreLinq.Tests -c Release --logger "console;verbosity=normal"

  efcore:
    name: Эксперименты с EF Core (SQLite, net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # verbosity=detailed нужен, чтобы в логе были SQL-запросы, которые тесты печатают через ITestOutputHelper
      - name: Эксперименты с EF Core
        run: dotnet test tests/CoreLinq.EfCore.Experiments -c Release --logger "console;verbosity=detailed"
