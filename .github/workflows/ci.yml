name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Новый коммит в той же ветке отменяет ещё не закончившийся прогон предыдущего
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linq:
    name: MyLinq и методичка (net8.0 + net10.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Проект тестов собирается под оба TFM, dotnet test прогоняет их по очереди.
      # TRX нужен итоговому шагу ниже
      - name: Тесты MyLinq
        run: >
          dotnet test tests/CoreLinq.Tests -c Release
          --logger "console;verbosity=normal"
          --logger trx --results-directory TestResults

      # Таблица итогов на странице прогона и аннотации; без этого шага счётчик тестов виден только в сыром логе
      - name: Итоги тестов MyLinq
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/test-summary.py "Тесты MyLinq" TestResults

  efcore:
    name: Эксперименты с EF Core (SQLite, net10.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # verbosity=detailed нужен, чтобы в логе были SQL-запросы, которые тесты печатают через ITestOutputHelper
      - name: Эксперименты с EF Core
        run: >
          dotnet test tests/CoreLinq.EfCore.Experiments -c Release
          --logger "console;verbosity=detailed"
          --logger trx --results-directory TestResults

      # SQL каждого эксперимента попадает в сводку прогона: открой страницу прогона и разверни нужный тест
      - name: Итоги экспериментов с EF Core
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/test-summary.py "Эксперименты с EF Core" TestResults

      # ВРЕМЕННО: вытаскиваю в аннотацию версии пакетов и вывод тестов, чтобы сверить SQL с руководством
      - name: DEBUG (временный шаг)
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import glob, subprocess, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}

          def esc(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          packages = subprocess.run(
              ["dotnet", "list", "tests/CoreLinq.EfCore.Experiments", "package", "--include-transitive"],
              capture_output=True, text=True).stdout
          wanted = [" ".join(l.split()) for l in packages.splitlines()
                    if any(k in l for k in ("EntityFrameworkCore", "Data.Sqlite", "SQLitePCLRaw", "Castle"))]
          print("::notice title=DEBUG packages::" + esc("\n".join(wanted)))

          parts = []
          for f in sorted(glob.glob("TestResults/**/*.trx", recursive=True)):
              for r in ET.parse(f).getroot().iter("{%s}UnitTestResult" % ns["t"]):
                  out = r.findtext("t:Output/t:StdOut", default="", namespaces=ns).strip()
                  if out:
                      parts.append("### " + r.get("testName").split(".")[-1] + "\n" + out)
          print("::notice title=DEBUG stdout::" + esc("\n\n".join(parts)[:60000]))
          PY
